    transition_in: hard_cut       # the ₹8,400 slam — full impact, no bleed
  - id: lesson
    from: "@not_because"
    to:   "@second_opinion"
    transition_in: blackout       # breath beat between loss and lesson
  - id: do_this_one
    from: "@second_opinion"
    to:   end
