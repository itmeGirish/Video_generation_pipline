    from: start
    to:   "@stress_test"
  - id: argue_against
    from: "@stress_test"
    to:   "@heres_prompt"
  - id: prompt_demo
    from: "@heres_prompt"
    to:   "@most_important"
  - id: tone_shift
    from: "@most_important"
    to:   "@day_eleven"
    transition_in: hard_cut       # clean slate for the emotional pivot
  - id: day_11_conversation
    from: "@day_eleven"
    to:   "@eight_thousand"
    transition_in: hard_cut       # the day-11 chat needs its own canvas
  - id: pnl_loss
    from: "@eight_thousand"
