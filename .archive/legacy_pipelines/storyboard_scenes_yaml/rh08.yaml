id: rh08
audio_file: vo-rh08.mp3

narration: |
  Three levels.
  Level one, the wrapper. One AI, one tool, no memory. Eighty percent of AI products on Product Hunt. Ship in a weekend.
  Level two, the agent. What you just watched. Cursor, Claude Code, the Mumbai flight demo. Ten times harder. A hundred times more useful.
  Level three, the system. Multiple agents, long-term memory, evaluation loops. Overkill for most. Essential for a few.

