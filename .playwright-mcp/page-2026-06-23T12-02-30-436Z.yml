          - paragraph [ref=e138]:
            - text: An
            - link "e-reader" [ref=e139] [cursor=pointer]:
              - /url: /wiki/E-reader
            - text: ", also known as an e-book reader, is a"
            - link "portable electronic device" [ref=e140] [cursor=pointer]:
              - /url: /wiki/Mobile_device
            - text: that is designed primarily for the purpose of reading
            - link "e-books" [ref=e141] [cursor=pointer]:
              - /url: /wiki/E-book
            - text: and
            - link "periodicals" [ref=e142] [cursor=pointer]:
              - /url: /wiki/Periodical_literature
            - text: . E-readers have a similar
            - link "form factor" [ref=e143] [cursor=pointer]:
              - /url: /wiki/Form_factor_(design)
            - text: to a
            - link "tablet" [ref=e144] [cursor=pointer]:
              - /url: /wiki/Tablet_computer
            - text: ; usually use
            - link "electronic paper" [ref=e145] [cursor=pointer]:
              - /url: /wiki/Electronic_paper
            - text: resulting in better screen
            - link "readability" [ref=e146] [cursor=pointer]:
              - /url: /wiki/Readability
            - text: ", especially in"
            - link "bright sunlight" [ref=e147] [cursor=pointer]:
              - /url: /wiki/High_brightness_monitor
            - text: ; and have longer battery life when compared to a tablet. An e-reader's battery will typically last for multiple weeks. In contrast to an e-reader, a tablet has a screen capable of higher refresh rates which make them more suitable for interaction such as playing a
            - link "video game" [ref=e148] [cursor=pointer]:
              - /url: /wiki/Video_game
            - text: or watching a
            - link "video clip" [ref=e149] [cursor=pointer]:
              - /url: /wiki/Digital_video
            - text: .
            - superscript [ref=e150]:
              - link "[1]" [ref=e151] [cursor=pointer]:
                - /url: "#cite_note-1"
          - generic [ref=e152]:
            - heading "Types of electronic-paper displays" [level=2] [ref=e153]
            - generic [ref=e154]:
              - link "edit":
                - /url: /w/index.php?title=Comparison_of_e-readers&action=edit&section=1
          - 'figure "Comparison of screen to paper size: A5 paper, 10.1-inch (257 mm) screen and A4 paper" [ref=e155]':
            - link [ref=e156] [cursor=pointer]:
              - /url: /wiki/File:ReMarkable_tablet_A4_A5_paper.jpg
              - img [ref=e157]
            - generic [ref=e158]: "Comparison of screen to paper size: A5 paper, 10.1-inch (257 mm) screen and A4 paper"
          - paragraph [ref=e159]:
            - text: All electronic paper types offer lower power consumption and better sunlight contrast than
            - link "LCDs" [ref=e160] [cursor=pointer]:
              - /url: /wiki/Liquid-crystal_display
            - text: .
            - link "E Ink" [ref=e161] [cursor=pointer]:
              - /url: /wiki/E_Ink
            - text: displays do not produce any light by themselves, so some models offer a frontlight for reading in dark areas.
          - list [ref=e162]:
            - listitem [ref=e163]:
              - link "E ink" [ref=e164] [cursor=pointer]:
                - /url: /wiki/E_Ink#Commercial_display_products
              - text: ":"
              - link "E Ink Corporation" [ref=e165] [cursor=pointer]:
                - /url: /wiki/E_Ink_Corporation
              - text: "'s 1st-generation technology, also known as E Ink Vizplex. Although \"eInk\" may be used to talk about all electronic paper displays, \"eInk\" and \"E Ink\" are"
              - link "trademarked" [ref=e166] [cursor=pointer]:
                - /url: /wiki/Trademark
              - text: by E Ink, which provides the majority of the electronic paper displays used in devices.
            - listitem [ref=e167]:
              - link "E Ink Pearl" [ref=e168] [cursor=pointer]:
                - /url: /wiki/E_Ink_Pearl
              - text: ": E Ink's 2nd-generation technology, which has higher contrast and a greater number of different levels of gray than their earlier technology. A further revision of Pearl is"
              - link "Mobius" [ref=e169] [cursor=pointer]:
                - /url: /wiki/E_Ink#Versions_or_models_of_E_Ink
              - text: ", which uses flexible plastic in the display."
            - listitem [ref=e170]:
              - link "E Ink Triton" [ref=e171] [cursor=pointer]:
                - /url: /wiki/E_Ink_Triton
              - text: ": E Ink's 3rd-generation technology that featured the ability to show color in the display."
            - listitem [ref=e172]:
              - link "E Ink Carta" [ref=e173] [cursor=pointer]:
                - /url: /wiki/E_Ink#Versions_or_models_of_E_Ink
              - text: ": E Ink's 4th-generation technology, which has higher contrast and a greater number of different levels of gray than their earlier technology; the displays have a"
              - link "pixel density" [ref=e174] [cursor=pointer]:
                - /url: /wiki/Pixel_density
              - text: between 212 and 300 ppi.
            - listitem [ref=e175]:
              - text: "E Ink Kaleido: E Ink's colour e-paper display supporting up to 4096 colours, used in various e-readers such as"
              - link "BOOX Go Color 7" [ref=e176] [cursor=pointer]:
                - /url: /wiki/BOOX_Go_Color_7
              - text: and
              - link "Kobo Libra Colour" [ref=e177] [cursor=pointer]:
                - /url: /w/index.php?title=Kobo_Libra_Colour&action=edit&redlink=1
            - listitem [ref=e178]: "SiPix: A former competitor to E Ink, which had displays with almost instantaneous page turns. It was acquired by E Ink in December 2012."
            - listitem [ref=e179]:
              - text: "LG Flex: Electronic paper that allows a"
              - link "flexible screen" [ref=e180] [cursor=pointer]:
                - /url: /wiki/Rollable_display
              - text: ; is still in development. With these displays, the user is able to bend the e-reader without damaging it and can fold it up to put in a pocket.
          - paragraph [ref=e181]:
            - text: Electronic-paper readers come in various sizes. Many small e-readers have display diagonal sizes around 150 or 180 mm (6 or 7 in), while some of the large commercially available readers have display sizes around
            - link "A5" [ref=e182] [cursor=pointer]:
              - /url: /wiki/Paper_size
            - text: (257 mm (10.1 in)) or A4 size (364 mm (14.3 in)).
